name: Android emulator smoke test

# Runtime validation in CI: build an x86_64 APK, boot an Android emulator,
# install + launch the app, and assert the native/JNI lifecycle runs. This
# is the closest to "does it actually run" achievable without a physical
# Vulkan device + a (copyrighted) Xbox BIOS dump. It validates everything
# up to and including JNI -> native entry and the Vulkan presenter attempt;
# the full nv2a game-frame blit still needs a real Adreno GPU + BIOS.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/port-android-apk-*'

concurrency:
  group: android-emu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  emulator-smoke:
    name: Emulator smoke test (x86_64)
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
      ANDROID_API_LEVEL: 34
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            ndk;${{ env.NDK_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install meson + ninja + glib build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3-pip \
            pkg-config gettext bison flex python3-setuptools libffi-dev zlib1g-dev
          sudo python3 -m pip install --upgrade meson

      - name: Configure local.properties
        working-directory: android
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          } > local.properties

      - name: Bootstrap gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build x86_64 APK
        working-directory: android
        env:
          XEMU_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace -PxemuAbi=x86_64 \
            :app:assembleDebug 2>&1 | tee gradle-x86_64.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb logcat -c || true
            APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
            echo "Installing $APK"
            adb install -r -g "$APK" || adb install -r "$APK"

            # Launch EmulatorActivity directly (no launcher/BIOS needed for the
            # lifecycle smoke test - it runs with config_json "{}" and exercises
            # JNI -> native entry + the Vulkan presenter thread).
            adb shell am start -W -n app.xemu/.EmulatorActivity || true

            # libxemu.so is large and the software emulator JITs slowly; give
            # the native lib time to load and the display thread to log.
            for i in $(seq 1 12); do
              sleep 5
              if adb logcat -d 2>/dev/null | grep -Eq \
                 "xemu_android_thread|xemu_android_start|FATAL EXCEPTION|UnsatisfiedLink|app.xemu.*(crash|died)"; then
                break
              fi
              echo "  ... waiting for native markers (${i}/12)"
            done

            # Full, unfiltered logcat: load-time crashes (UnsatisfiedLinkError,
            # SIGSEGV) log under AndroidRuntime/DEBUG, NOT our xemu tags, so the
            # previous tag-filtered capture hid the actual failure cause.
            adb logcat -d > emu-logcat-full.txt 2>/dev/null || true
            adb logcat -d -s xemu xemu-vk xemu-jni AndroidRuntime DEBUG libc \
              > emu-logcat.txt 2>/dev/null || true

            echo "===== app.xemu process state ====="
            adb shell pidof app.xemu && echo "(app.xemu is alive)" \
              || echo "(app.xemu is NOT running - may have crashed or exited)"
            echo "===== crash / loader diagnostics ====="
            grep -nE "FATAL EXCEPTION|UnsatisfiedLink|dlopen failed|cannot locate symbol|SIGSEGV|app.xemu.*(crash|died)|beginning of crash" \
              emu-logcat-full.txt | head -n 40 || echo "(no crash signatures found)"
            echo "===== xemu-tagged logcat ====="
            cat emu-logcat.txt
            echo "=================================="

            fail=0
            check() {
              # Search the FULL log so a marker isn't missed due to tag filtering.
              if grep -Eq "$2" emu-logcat-full.txt; then
                echo "[PASS] $1"
              else
                echo "[FAIL] $1"; fail=1
              fi
            }
            # Genuinely testable in an emulator (no BIOS, software Vulkan):
            check "JNI -> native entry reached" "xemu_android_start"
            check "display thread started"      "xemu_android_thread: start|display loop|wait_for_window|Acquired ANativeWindow|nv2a not present|Requesting .* Vulkan instance"
            echo "--- informational (GPU/BIOS dependent) ---"
            grep -Eq "Swapchain extent|Created Android Vulkan|shared: presenting" emu-logcat-full.txt \
              && echo "[seen] Vulkan swapchain presented" \
              || echo "[ -- ] Vulkan swapchain (emulator GPU may lack Vulkan)"
            test "$fail" -eq 0

      - name: Stage logs for the report job
        if: always()
        run: |
          mkdir -p emu-logs
          cp -f android/gradle-x86_64.log emu-logs/ 2>/dev/null || true
          cp -f emu-logcat.txt emu-logs/ 2>/dev/null || true
          cp -f emu-logcat-full.txt emu-logs/ 2>/dev/null || true
          # Always leave at least one file so upload-artifact has something.
          echo "commit ${GITHUB_SHA}" > emu-logs/_marker.txt
          ls -la emu-logs/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-logs
          path: emu-logs/**
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Separate reporting job. The inline "post to PR" step inside the emulator
  # job never produced a comment (the emulator-runner action's failure mode
  # appears to disrupt the surrounding step flow / working dir). Decoupling it
  # into its own job - which downloads the uploaded artifact and posts via the
  # REST API instead of `gh` - guarantees the diagnostic actually lands on the
  # PR regardless of what happened inside the emulator job.
  # ---------------------------------------------------------------------------
  report-failure:
    name: Report emulator smoke-test failure
    needs: emulator-smoke
    if: failure()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download emulator logs
        uses: actions/download-artifact@v4
        with:
          name: emulator-smoke-logs
          path: emu-logs
        continue-on-error: true

      - name: Post diagnostic to PR (REST API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          FULL=emu-logs/emu-logcat-full.txt
          XEMU=emu-logs/emu-logcat.txt
          GRADLE=emu-logs/gradle-x86_64.log

          # If the x86_64 build failed, surface the compiler diagnostic.
          glog=$(grep -E -B 30 -A 5 'FAILED:|fatal error|error: ' "$GRADLE" 2>/dev/null | tail -c 20000)

          # Loader/crash signatures: UnsatisfiedLinkError / dlopen / SIGSEGV log
          # under AndroidRuntime/DEBUG/libc, not our xemu tags - this is the
          # most likely cause when the lifecycle markers are missing.
          crash=$(grep -nE \
            "FATAL EXCEPTION|UnsatisfiedLink|dlopen failed|cannot locate symbol|SIGSEGV|app.xemu.*(crash|died)|beginning of crash|EmulatorActivity|libxemu loaded|surfaceCreated|nativeStart" \
            "$FULL" 2>/dev/null | head -n 60)
          xlog=$(tail -c 6000 "$XEMU" 2>/dev/null)
          flog=$(tail -c 16000 "$FULL" 2>/dev/null)

          {
            printf '## :x: Android emulator smoke test failed (commit `%s`)\n\n' "${GITHUB_SHA:0:7}"
            printf 'Run: %s/%s/actions/runs/%s\n\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf '**Lifecycle / crash / loader signatures:**\n```\n%s\n```\n\n' "${crash:-(none found - emulator may not have booted; see full log)}"
            if [ -n "$glog" ]; then
              printf '<details><summary>x86_64 build error</summary>\n\n```\n%s\n```\n</details>\n\n' "$glog"
            fi
            printf '<details><summary>xemu-tagged logcat</summary>\n\n```\n%s\n```\n</details>\n\n' "${xlog:-(none)}"
            printf '<details><summary>full logcat (tail)</summary>\n\n```\n%s\n```\n</details>\n' "${flog:-(none)}"
          } > comment.md
          echo "comment body size: $(wc -c < comment.md) bytes"

          # Resolve PR number (push event has no pull_request context).
          PR=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?head=Rhetorikk:${GITHUB_REF_NAME}&state=open" \
               | jq -r '.[0].number // empty')
          [[ "$PR" =~ ^[0-9]+$ ]] || PR=1
          echo "Posting to PR #${PR}"

          jq -Rs '{body: .}' comment.md > payload.json
          http=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --data @payload.json)
          echo "HTTP ${http}"
          head -c 600 resp.json
          exit 0
