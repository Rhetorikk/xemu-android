name: Build for Android

on:
  workflow_call:
    inputs:
      pkg_version:
        description: Build version
        required: false
        default: 'dev'
        type: string
  workflow_dispatch:
  push:
    branches:
      - 'claude/port-android-apk-*'
    paths:
      - 'android/**'
      - 'scripts/meson-cross/**'
      - 'configs/meson/android.txt'
      - 'ui/xemu-android*.c'
      - 'ui/xemu-os-utils-android.c'
      - 'ui/meson.build'
      - 'meson.build'
      - 'hw/xbox/nv2a/pgraph/vk/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/meson-cross/**'
      - 'configs/meson/android.txt'
      - 'ui/xemu-android*.c'
      - 'ui/xemu-os-utils-android.c'
      - 'ui/meson.build'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-22.04
    env:
      ANDROID_API_LEVEL: 35
      ANDROID_BUILD_TOOLS_VERSION: 35.0.0
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.NDK_VERSION }}

      - name: Install meson + ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake python3-pip
          python3 -m pip install --upgrade meson

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache meson build
        uses: actions/cache@v4
        with:
          path: |
            android/app/build/meson-android
          key: meson-android-${{ github.sha }}
          restore-keys: meson-android-

      - name: Configure local.properties
        working-directory: android
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          } > local.properties

      - name: Bootstrap gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi

      - name: Assemble debug APK
        working-directory: android
        env:
          XEMU_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xemu-android-arm64-v8a-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
